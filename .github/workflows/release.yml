name: Release Management

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.3)'
        required: true
        type: string

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.12'

jobs:
  # Validation de la release
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: Generate changelog
      id: changelog
      run: |
        # Génération automatique du changelog
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        if [ -n "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD)
        else
          CHANGELOG=$(git log --pretty=format:"- %s")
        fi
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Validate version format
      run: |
        if [[ ! "${{ steps.version.outputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "❌ Format de version invalide. Utilisez le format v1.2.3"
          exit 1
        fi

  # Build des artefacts de release
  build-release-artifacts:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build
        npm run export
        tar -czf ../frontend-${{ needs.validate-release.outputs.version }}.tar.gz .next/
        
    - name: Build backend
      run: |
        cd backend
        pip install -r requirements.txt
        python -m compileall app/
        tar -czf ../backend-${{ needs.validate-release.outputs.version }}.tar.gz app/ requirements.txt
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts-${{ needs.validate-release.outputs.version }}
        path: |
          frontend-${{ needs.validate-release.outputs.version }}.tar.gz
          backend-${{ needs.validate-release.outputs.version }}.tar.gz

  # Build et push des images Docker avec tags de version
  build-release-images:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        
    - name: Extract version number
      id: version
      run: |
        VERSION=${{ needs.validate-release.outputs.version }}
        echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
    
    - name: Build and push backend release image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/recrute-ia-backend:${{ steps.version.outputs.version }}
          ${{ secrets.DOCKER_HUB_USERNAME }}/recrute-ia-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        labels: |
          org.opencontainers.image.version=${{ needs.validate-release.outputs.version }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          org.opencontainers.image.revision=${{ github.sha }}
    
    - name: Build and push frontend release image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/recrute-ia-frontend:${{ steps.version.outputs.version }}
          ${{ secrets.DOCKER_HUB_USERNAME }}/recrute-ia-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        labels: |
          org.opencontainers.image.version=${{ needs.validate-release.outputs.version }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          org.opencontainers.image.revision=${{ github.sha }}

  # Tests de régression sur la release
  regression-tests:
    needs: [validate-release, build-release-images]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run release tests
      run: |
        # Démarrer les services avec les nouvelles images
        docker-compose -f docker-compose.release.yml up -d
        sleep 60
        
        # Tests de sanité
        curl -f http://localhost:3000/health || exit 1
        curl -f http://localhost:5000/api/health || exit 1
        
        # Tests de régression
        npm run test:regression
        
    - name: Cleanup
      if: always()
      run: |
        docker-compose -f docker-compose.release.yml down -v

  # Création de la release GitHub
  create-github-release:
    needs: [validate-release, build-release-artifacts, build-release-images, regression-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-artifacts-${{ needs.validate-release.outputs.version }}
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.validate-release.outputs.version }}
        name: RecruteIA ${{ needs.validate-release.outputs.version }}
        body: |
          ## 🚀 RecruteIA ${{ needs.validate-release.outputs.version }}
          
          ### 📋 Changements
          ${{ needs.validate-release.outputs.changelog }}
          
          ### 🐳 Images Docker
          - Backend: `${{ secrets.DOCKER_HUB_USERNAME }}/recrute-ia-backend:${{ needs.validate-release.outputs.version }}`
          - Frontend: `${{ secrets.DOCKER_HUB_USERNAME }}/recrute-ia-frontend:${{ needs.validate-release.outputs.version }}`
          
          ### 📦 Installation
          ```bash
          # Avec Docker Compose
          docker-compose pull
          docker-compose up -d
          
          # Ou télécharger les artefacts ci-dessous
          ```
          
          ### 🔧 Migration
          Consultez le [guide de migration](./MIGRATION.md) pour les instructions de mise à jour.
        files: |
          frontend-${{ needs.validate-release.outputs.version }}.tar.gz
          backend-${{ needs.validate-release.outputs.version }}.tar.gz
        draft: false
        prerelease: ${{ contains(needs.validate-release.outputs.version, '-') }}

  # Déploiement automatique en production
  deploy-release:
    needs: [validate-release, create-github-release]
    runs-on: ubuntu-latest
    environment: production
    if: ${{ !contains(needs.validate-release.outputs.version, '-') }}
    steps:
    - name: Deploy release to production
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USERNAME }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd /opt/recrute-ia
          
          # Backup avant déploiement
          docker-compose exec -T postgres pg_dump -U $POSTGRES_USER $POSTGRES_DB > backup_pre_${{ needs.validate-release.outputs.version }}.sql
          
          # Mise à jour vers la nouvelle version
          export RECRUTE_IA_VERSION=${{ needs.validate-release.outputs.version }}
          docker-compose pull
          docker-compose up -d --remove-orphans
          
          # Vérification de santé
          sleep 60
          curl -f http://localhost/health || exit 1
          
          # Nettoyage
          docker system prune -af
          
    - name: Notify successful deployment
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: |
          🎉 RecruteIA ${{ needs.validate-release.outputs.version }} déployé avec succès en production!
          
          📋 Changements:
          ${{ needs.validate-release.outputs.changelog }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Mise à jour de la documentation
  update-documentation:
    needs: [validate-release, create-github-release]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Update version in documentation
      run: |
        # Mise à jour des fichiers de documentation
        sed -i "s/version: .*/version: ${{ needs.validate-release.outputs.version }}/" docs/config.yml
        sed -i "s/Version: .*/Version: ${{ needs.validate-release.outputs.version }}/" README.md
        
    - name: Commit documentation updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/ README.md
        git commit -m "docs: update version to ${{ needs.validate-release.outputs.version }}" || exit 0
        git push